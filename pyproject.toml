[project]
name = "bert-sentiment"
version = "0.1.0"
description = "Fine-tuning BERT on SST-2 for binary sentiment classification (full FT and LoRA)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "matplotlib>=3.10.0",
    "numpy>=2.4.0",
    "peft>=0.13.0",
    "pyyaml>=6.0",
    "torch>=2.11.0",
    "transformers>=4.40.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
